name: Update README

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
      - name: Fetch repos from GitHub API
        run: node scripts/fetch-repos.js
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Classify repos
        run: node scripts/classify.js

      - name: Generate README
        run: node scripts/generate-readme.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/repos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update README $(date +'%Y-%m-%d')"
          git push
