name: Monthly Wildcard Update

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Wildcard sweep (Channel 3)
        run: node scripts/fetch-wildcard.js
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Classify repos
        run: node scripts/classify.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json data/classified.json data/pending_ai_review.json data/first_seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: monthly wildcard update $(date +'%Y-%m-%d')"
          git push
